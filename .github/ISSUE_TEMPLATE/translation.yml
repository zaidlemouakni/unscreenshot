name: Translation fix
description: Something reads oddly in one of the languages.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Native speakers are very welcome. To add a new language, open a pull request with the README and the install guide (see CONTRIBUTING.md).
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Français
        - 简体中文
        - Español
        - Português (Brasil)
        - 日本語
        - Tiếng Việt
        - 한국어
        - فارسی
        - ไทย
        - العربية
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File
      placeholder: ".github/readme/README.ja.md"
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested text
    validations:
      required: true
